<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">  
<meta name="theme-color" content="#0756d8">
<title>DIRE-F — Digital Report Frontliner</title>

<link rel="icon" type="image/png" href="./dire-f-icon.png">
<link rel="apple-touch-icon" href="./dire-f-icon.png">
    <style>
:root{--blue:#0756d8;--blue2:#2f8df7;--light:#eaf4ff;--yellow:#ffd21c;--green:#16a56b;--ink:#10233f;--muted:#65748b;--danger:#dc3545}
*{box-sizing:border-box} body{margin:0;font-family:Inter,Arial,sans-serif;background:#fff;color:var(--ink)}
button,input,select,textarea{font:inherit} button{cursor:pointer}
.splash{position:fixed;inset:0;z-index:100;background:#063b9e;display:flex;align-items:center;justify-content:center}
.splash img{width:100%;height:100%;object-fit:cover}.start{position:absolute;bottom:12%;width:min(72%,360px);padding:15px 20px;border:0;border-radius:40px;background:#0865e8;color:#fff;font-weight:800;font-size:21px;box-shadow:0 0 22px #49c8ff}
.app{display:none;min-height:100vh;background:#fff}.top{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,#0756d8,#2b8ef4);color:#fff;padding:14px 16px 18px;border-radius:0 0 22px 22px;box-shadow:0 3px 15px #b7c8df}.toprow{display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;font-size:23px;font-style:italic}.sub{font-size:10px;opacity:.9}.content{padding:18px 15px 90px;max-width:720px;margin:auto}
h1{font-size:24px;margin:5px 0}.lead{color:var(--muted);margin-top:4px}.wave{height:5px;background:linear-gradient(90deg,var(--yellow),#35d08d,var(--blue));border-radius:10px;margin:14px 0 18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.menu{background:var(--light);border:1px solid #cfe4ff;border-radius:18px;padding:19px 10px;text-align:center;min-height:115px;color:var(--blue);font-weight:800;box-shadow:0 5px 13px #dfeafa}.menu .ico{font-size:30px;margin-bottom:8px}.menu small{display:block;color:var(--muted);font-weight:500;margin-top:5px}
.card{background:#fff;border:1px solid #dbe8f6;border-radius:16px;padding:15px;margin-bottom:13px;box-shadow:0 4px 13px #e8eef6}.section{background:#eef7ff;border-left:5px solid var(--blue);padding:12px;border-radius:12px;margin:15px 0 10px}.section h3{margin:0;color:var(--blue);font-size:16px}
label{display:block;font-weight:700;font-size:13px;margin:10px 0 6px}input,select,textarea{width:100%;border:1px solid #cbd8e8;border-radius:10px;padding:11px;background:#fff;color:var(--ink)}textarea{min-height:80px;resize:vertical}
.btnrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:800}.primary{background:var(--blue);color:#fff}.secondary{background:#e8f2ff;color:var(--blue)}.success{background:var(--green);color:#fff}.warning{background:var(--yellow);color:#17243a}.danger{background:var(--danger);color:#fff}
.status{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.status label{margin:0}.status input{display:inline-block}.status span{display:block;text-align:center;padding:9px 5px;border:1px solid #c9d8e8;border-radius:9px;background:#fff;font-size:12px}.status input:checked+span{background:#0756d8;color:#fff;border-color:#0756d8}
.note{font-size:12px;color:var(--muted);margin-top:6px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{border-bottom:1px solid #e5edf6;padding:9px;text-align:left;white-space:nowrap}.table th{background:#eef6ff;color:var(--blue)}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kpi .box{padding:14px;border-radius:14px;background:#eaf8f2;text-align:center}.num{font-size:25px;font-weight:900;color:var(--green)}.pill{display:inline-block;padding:7px 11px;border-radius:20px;background:#eaf8f2;color:#138456;font-weight:800;font-size:12px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dce7f3;padding:9px;display:flex;justify-content:center;z-index:9}.back{color:var(--blue);font-weight:800;background:none;border:0}
.toast{position:fixed;left:50%;bottom:75px;transform:translateX(-50%);background:#10233f;color:#fff;padding:11px 16px;border-radius:20px;display:none;z-index:200}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (min-width:700px){...}


/* SPLASH START - TOMBOL MULAI */
.splash-start {
    position: absolute;
    left: 10%;
    width: 80%;
    bottom: 16%;
    height: 14%;
    border: none;
    padding: 0;
    margin: 0;
    background: transparent;
    z-index: 999999;
    cursor: pointer;
    pointer-events: auto;
    touch-action: manipulation;
}


.splash-start:focus {
    outline: none;
}

.splash-start:active {
    transform: scale(0.97);
}

</style>
</head>
<body>
<div class="splash" id="splash">
    <img
        src="./dire-f-splash.png"
        alt="DIRE-F"
        class="splash-image"
    >

    <!-- Tombol transparan di atas tulisan MULAI -->
    <button
        id="start-app"
        class="splash-start"
        type="button"
    onclick="startApp(); return false;"
    
        aria-label="Mulai aplikasi">
    </button>
</div>

<div class="app" id="app">
<header class="top"><div class="toprow"><div><div class="brand">DIRE-F</div><div class="sub">Digital Report Frontliner</div></div><div>☰</div></div></header>
<main class="content" id="screen"></main>
<div class="bottom"><button class="back" onclick="home()">⌂ HOME</button></div>
</div>
<div class="toast" id="toast"></div>

<script>
let master = [
  {
    name:"Greeting",
    items:[
      "Senyum sapa salam",
      "Memperkenalkan diri dan sebut nama",
      "Jika sudah kenal sebut nama nasabah",
      "Menanyakan nama nasabah",
      "Menanyakan kebutuhan nasabah"
    ]
  },
  {
    name:"Socialization",
    items:[
      "Menginformasikan survey layanan VOC BSQ kepada nasabah Non K1",
      "Menginformasikan survey layanan VOC CE kepada nasabah K1"
    ]
  },
  {
    name:"Education",
    items:[
      "Melakukan edukasi VOC BSQ kepada nasabah Non K1",
      "Melakukan edukasi VOC CE kepada nasabah K1",
      "Melakukan edukasi penggunaan aplikasi dan mesin digital"
    ]
  },
  {
    name:"Telling",
    items:[
      "Melakukan penawaran produk sesuai kebutuhan nasabah",
      "Memberikan solusi produk yang sesuai dengan kebutuhan nasabah"
    ]
  },
  {
    name:"Satisfaction",
    items:[
      "Memproses transaksi dengan cepat",
      "Melayani dengan fokus",
      "Memproses transaksi dengan teliti",
      "Memberikan penjelasan yang lengkap",
      "Memberikan solusi dengan tuntas"
    ]
  },
  {
    name:"Appreciation",
    items:[
      "Menanyakan kebutuhan lain sebelum mengakhiri layanan",
      "Menyampaikan ucapan terima kasih",
      "Menyampaikan kata-kata magic word"
    ]
  },
  {
    name:"Checking",
    items:[
      "Melakukan pengecekan nasabah K1 untuk melakukan VOC CE"
    ]
  },
  {
    name:"Report & FollowUp",
    items:[
      "Menginput penawaran solusi yang diberikan",
      "Menindaklanjuti setiap penawaran solusi yang diberikan"
    ]
  }
];
const savedMaster = localStorage.getItem("diref_master");

if(savedMaster){
  master = JSON.parse(savedMaster);
}    
let observations = JSON.parse(localStorage.getItem("diref_obs")||"[]");
let frontliners = JSON.parse(localStorage.getItem("diref_frontliners")||"[]");
let editId=null;

function saveAll(){localStorage.setItem("diref_obs",JSON.stringify(observations));localStorage.setItem("diref_frontliners",JSON.stringify(frontliners))}
function toast(t){let x=document.getElementById("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",1800)}
function startApp(){document.getElementById("splash").style.display="none";document.getElementById("app").style.display="block";home()}
function home(){
 editId=null;
 document.getElementById("screen").innerHTML=`
 <h1>Digital Report Frontliner</h1><p class="lead">Selamat datang di DIRE-F. Kelola observasi, score, dan laporan Frontliner.</p><div class="wave"></div>
 <div class="grid">
  ${menu("👥","Register","Data Frontliner","register")}
${menu("📋","Observasi","Checklist penilaian","observasi")}
${menu("📊","Daily Report","Rekap observasi harian","daily")}
${menu("📚","Master Penilaian","Item penilaian","masterPage")}
${menu("⭐","Score Observasi","Score & histori","scorePage")}
${menu("🖨️","Cetak Laporan","Preview & share","printPage")}
 </div>`;
}
function menu(i,t,s,k){
  return `<button class="menu" onclick="${k}()">
    <div class="menu-icon">${i}</div>
    <div class="menu-title">${t}</div>
    <div class="menu-sub">${s}</div>
  </button>`;
}
function register(){
 document.getElementById("screen").innerHTML=`<h1>Register Frontliner</h1><p class="lead">Kelola nama dan unit kerja.</p>
 <div class="card"><label>Nama Frontliner</label><input id="rname" placeholder="Masukkan nama">
 <label>Unit Kerja</label><input id="runit" placeholder="Masukkan unit kerja">
 <div class="btnrow"><button class="btn primary" onclick="saveReg()">💾 Save</button><button class="btn danger" onclick="clearReg()">🗑 Delete</button></div></div>
 <div class="card"><h3>Daftar Frontliner</h3><div class="tablewrap"><table class="table"><tr><th>Nama</th><th>Unit</th><th>Aksi</th></tr>${frontliners.map((f,i)=>`<tr><td>${esc(f.name)}</td><td>${esc(f.unit)}</td><td><button class="btn secondary" onclick="editReg(${i})">Edit</button> <button class="btn danger" onclick="delReg(${i})">Delete</button></td></tr>`).join("")||"<tr><td colspan=3>Belum ada data.</td></tr>"}</table></div></div>`;
}
function saveReg(){let n=document.getElementById("rname").value.trim(),u=document.getElementById("runit").value.trim();if(!n||!u)return toast("Nama dan unit kerja wajib diisi");frontliners.push({name:n,unit:u});saveAll();toast("Data tersimpan");register()}
function clearReg(){document.getElementById("rname").value="";document.getElementById("runit").value="";toast("Form dikosongkan")}
function editReg(i){let f=frontliners[i],n=prompt("Nama Frontliner",f.name),u=prompt("Unit Kerja",f.unit);if(n&&u){frontliners[i]={name:n,unit:u};saveAll();register()}}
function delReg(i){if(confirm("Hapus data Frontliner?")){frontliners.splice(i,1);saveAll();register()}}
function observasi(id=null){
  editId=id;

  let o=id!==null ? observations.find(x=>x.id===id) : null;

  document.getElementById("screen").innerHTML=`
    <h1>Observasi Frontliner</h1>

    <div class="card">
      <label>Tanggal Observasi</label>
      <input type="date" id="odate" value="${o?.date||""}">

      <label>Nama Frontliner</label>
      <select id="oname">
        <option value="">Pilih nama Frontliner</option>
        ${frontliners.map(f=>`
          <option value="${f.name}" ${o?.name===f.name?"selected":""}>
            ${f.name}
          </option>
        `).join("")}
      </select>

      <label>Jenis Nasabah</label>
    <select id="customerType" onchange="updateAssessment()">
        <option value="">Pilih Jenis Nasabah</option>
        <option value="Perorangan Non K1">Perorangan Non K1</option>
        <option value="Perorangan K1">Perorangan K1</option>
        <option value="PT Non K1">PT Non K1</option>
        <option value="PT K1">PT K1</option>
        <option value="Prioritas Non K1">Prioritas Non K1</option>
        <option value="Prioritas K1">Prioritas K1</option>
      </select>

      <label>Target Customer (1-10)</label>
      <input type="number" id="target" min="1" max="10"
        value="${o?.target||1}">

      <div id="assess">
        ${master.map((m,mi)=>sectionHTML(m,mi,o)).join("")}
      </div>

      <div class="btnrow">
        <button class="btn primary" onclick="saveObs()">💾 SAVE OBSERVASI</button>
      </div>
    </div>
  `;
}

    function sectionHTML(m,mi,o){
  let customerType=document.getElementById("customerType")?.value||o?.customerType||"";

  let isK1=customerType && !customerType.includes("Non K1");

  let items=m.items.filter(item=>{
    let text=item.toLowerCase();

    if(text.includes("bsq")){
      return !isK1;
    }

    if(text.includes("ce")){
      return isK1;
    }

    if(m.name==="Checking"){
      return isK1;
    }

    return true;
  });

  if(!items.length)return "";

  let saved=o?.sections?.[mi];

  return `
    <div class="card">
      <div class="section">
        <h3>${mi+1}. ${m.name}</h3>

        ${items.map((item,ii)=>{
          let originalIndex=m.items.indexOf(item);
          let val=saved?.items?.[originalIndex]?.status||"";

          return `
            <div class="obs-item">
              <strong>${originalIndex+1}. ${item}</strong>

              <div class="status">
                <label>
                  <input type="radio"
                    name="status_${mi}_${originalIndex}"
                    value="Complete"
                    ${val==="Complete"?"checked":""}>
                  Complete<br>(100)
                </label>

                <label>
                  <input type="radio"
                    name="status_${mi}_${originalIndex}"
                    value="In Complete"
                    ${val==="In Complete"?"checked":""}>
                  In Complete<br>(50)
                </label>

                <label>
                  <input type="radio"
                    name="status_${mi}_${originalIndex}"
                    value="No"
                    ${val==="No"?"checked":""}>
                  No<br>(0)
                </label>
              </div>

              <label>Catatan Observasi</label>
              <textarea
                id="note_${mi}_${originalIndex}"
                placeholder="Tulis catatan observasi..."
              >${saved?.items?.[originalIndex]?.note||""}</textarea>
            </div>
          `;
        }).join("")}
      </div>
    </div>
  `;
}
    function updateAssessment(){
  let o=editId!==null
    ? observations.find(x=>x.id===editId)
    : null;

  document.getElementById("assess").innerHTML=
    master.map((m,mi)=>sectionHTML(m,mi,o)).join("");
}
function saveObs(){
  let date=document.getElementById("odate").value;
  let name=document.getElementById("oname").value;
  let customerType=document.getElementById("customerType").value;
  let target=document.getElementById("target").value;

  if(!name)return toast("Pilih nama Frontliner");
  if(!customerType)return toast("Pilih Jenis Nasabah");

  let sections=master.map((m,mi)=>({
    name:m.name,
    items:m.items.map((item,ii)=>({
      item:item,
    status:document.querySelector(
`input[name="status_${mi}_${originalIndex}"]:checked`
)?.value||"" 
      note:document.getElementById(`note_${mi}_${ii}`)?.value||""
    }))
  }));
    
let allItems=sections.flatMap(s=>s.items);
let scored=allItems.filter(x=>x.status);
let score=scored.length?scored.reduce((a,x)=>a+(x.status==="Complete"?100:x.status==="In Complete"?50:0),0)/scored.length:0;
  let obj={
    id:editId||Date.now(),
    date,
    name,
    customerType,
    target,
    sections, 
      score
  };

  if(editId){
    let i=observations.findIndex(x=>x.id===editId);
    observations[i]=obj;
  }else{
    observations.push(obj);
  }

  saveAll();
  toast("Observasi tersimpan");
  daily();
}
 function deleteObs(id){
  if(confirm("Hapus hasil observasi ini?")){
    observations=observations.filter(x=>x.id!==id);
    saveAll();
    toast("Observasi dihapus");
    daily();
  }
}

function clearObservations(){
  if(!observations.length){
    return toast("Belum ada data observasi");
  }

  if(confirm("Hapus SEMUA data observasi? Data Daily Report dan Score juga akan kosong.")){
    observations=[];
    saveAll();
    toast("Semua data observasi dihapus");
    daily();
  }
}
function daily(){
 
 document.getElementById("screen").innerHTML=`
<h1>Daily Report</h1>
<p class="lead">Rekap hasil observasi harian.</p>

<div class="card">
<label>Tampilan</label>
<select id="dfilter" onchange="renderDaily()">
<option value="all">Semua Nama</option>
${frontliners.map(f=>`<option>${esc(f.name)}</option>`).join("")}
</select>

<label>Tanggal</label>
<input type="date" id="ddate"
value="${new Date().toISOString().slice(0,10)}"
onchange="renderDaily()">
</div>

<div id="dailyTable"></div>

<div class="btnrow">
<button class="btn danger" onclick="clearObservations()">
🗑️ HAPUS SEMUA DATA
</button>
</div>
`;

renderDaily();
}
function renderDaily(){
  let d=document.getElementById("ddate")?.value||"";
  let f=document.getElementById("dfilter")?.value||"all";

  let rows=observations.filter(o=>{
    let sameName=(f==="all"||o.name===f);
    let sameDate=(!d||o.date===d);
    return sameName&&sameDate;
  });

  let box=document.getElementById("dailyTable");

  if(!box)return;

  if(!rows.length){
    box.innerHTML=`
      <div class="card">
        <b>Belum ada observasi.</b>
        <p>Belum ada data observasi untuk nama dan tanggal yang dipilih.</p>
      </div>`;
    return;
  }

  box.innerHTML=`
    <div class="card">
      <div class="tablewrap">
        <table class="table">
          <tr>
            <th>Tanggal</th>
            <th>Nama</th>
            <th>Target</th>
            <th>Score</th>
            <th>Aksi</th>
          </tr>

          ${rows.map(o=>`
            <tr>
              <td>${o.date||"-"}</td>
              <td>${esc(o.name)}</td>
              <td>${o.target||"-"}</td>
              <td><b>${Number(o.score||0).toFixed(1)}</b></td>
              <td>
                <button class="btn secondary"
                  onclick="observasi(${o.id})">
                  Lihat/Edit
                </button>
              </td>
            </tr>
          `).join("")}

        </table>
      </div>
    </div>`;
}
function masterPage(){
  document.getElementById("screen").innerHTML=`
    <h1>Master Penilaian</h1>
    <p class="lead">Kelola item penilaian Frontliner.</p>

    ${master.map((m,mi)=>`
      <div class="card">
        <h2>${mi+1}. ${m.name}</h2>

        ${m.items.map((item,ii)=>`
          <div style="margin-bottom:12px;">
            <input
              type="text"
              id="master_${mi}_${ii}"
              value="${esc(item)}"
            >

            <div class="btnrow">
              <button class="btn primary"
                onclick="saveMasterItem(${mi},${ii})">
                💾 SIMPAN
              </button>

              <button class="btn danger"
                onclick="deleteMasterItem(${mi},${ii})">
                🗑️ HAPUS
              </button>
            </div>
          </div>
        `).join("")}

        <div class="btnrow">
          <button class="btn secondary"
            onclick="addMasterItem(${mi})">
            ➕ TAMBAH ITEM ${m.name}
          </button>
        </div>
      </div>
    `).join("")}
  `;
}
    function saveMaster(){
  localStorage.setItem("diref_master",JSON.stringify(master));
}
   function saveMasterItem(mi,ii){
  let input=document.getElementById(`master_${mi}_${ii}`);
  if(!input)return;

  let value=input.value.trim();

  if(!value){
    return toast("Item penilaian tidak boleh kosong");
  }

  master[mi].items[ii]=value;
  saveMaster();
  toast("Item berhasil disimpan");
  masterPage();
}

function addMasterItem(mi){
  let item=prompt(`Masukkan item baru untuk ${master[mi].name}:`);

  if(!item)return;

  item=item.trim();

  if(!item){
    return toast("Item penilaian tidak boleh kosong");
  }

  master[mi].items.push(item);
  saveMaster();
  toast("Item berhasil ditambahkan");
  masterPage();
}

function deleteMasterItem(mi,ii){
  if(confirm("Hapus item penilaian ini?")){
    master[mi].items.splice(ii,1);
    saveMaster();
    toast("Item berhasil dihapus");
    masterPage();
  }
} 
function scorePage(){
 let names=[...new Set(observations.map(o=>o.name))];
 document.getElementById("screen").innerHTML=`<h1>Score Observasi</h1><p class="lead">Score, review, improvement, dan histori konsistensi.</p><div class="card"><label>Nama Frontliner</label><select id="sname" onchange="renderScore()"><option value="">Pilih nama</option>${names.map(n=>`<option>${esc(n)}</option>`).join("")}</select></div><div id="scoreResult"></div>`
renderScore();
}
function renderScore(){
  let n=document.getElementById("sname").value;
  let r=document.getElementById("scoreResult");

  if(!n){
    r.innerHTML="";
    return;
  }

  let rows=observations
    .filter(o=>o.name===n)
    .sort((a,b)=>a.date.localeCompare(b.date));

  function scoreObs(o){
    let all=[];

    (o.sections||[]).forEach(s=>{
      (s.items||[]).forEach(x=>{
        if(x.status){
          all.push(
            x.status==="Complete"
              ?100
              :x.status==="In Complete"
                ?50
                :0
          );
        }
      });
    });

    return all.length
      ?all.reduce((a,b)=>a+b,0)/all.length
      :0;
  }

  rows.forEach(o=>{
    o.score=scoreObs(o);
  });

  let avg=rows.length
    ?rows.reduce((a,o)=>a+o.score,0)/rows.length
    :0;

  let stable="BELUM ADA DATA";

  if(rows.length>=2){
    let scores=rows.map(o=>o.score);
    let max=Math.max(...scores);
    let min=Math.min(...scores);

    stable=(max-min<=25)
      ?"KONSISTEN"
      :"PERLU PERHATIAN";
  }

  let low=[];

  rows.forEach(o=>{
    (o.sections||[]).forEach(s=>{
      (s.items||[]).forEach(x=>{
        if(x.status==="In Complete" || x.status==="No"){
          low.push({
            category:s.name,
            item:x.item,
            status:x.status
          });
        }
      });
    });
  });

  let review=low.length
    ?low.map(x=>
      `<li><b>${x.category}</b> - ${x.item}
      <br><span class="muted">Status: ${x.status}</span></li>`
    ).join("")
    :"Tidak ada aspek yang perlu diperhatikan.";

  let suggestion=low.length
    ?low.map(x=>
      `<li>Tingkatkan konsistensi pada <b>${x.item}</b>
      dalam kategori <b>${x.category}</b>.</li>`
    ).join("")
    :"Pertahankan performa dan konsistensi layanan.";

  r.innerHTML=`
    <div class="card">
      <div class="kpi">

        <div class="box">
          <div>Rata-rata Score</div>
          <div class="num">${avg.toFixed(1)}</div>
        </div>

        <div class="box">
          <div>Status</div>
          <div class="pill">${stable}</div>
        </div>

      </div>
    </div>

    <div class="card">
      <h3>History Score</h3>

      <div class="tablewrap">
        <table class="table">
          <tr>
            <th>Tanggal</th>
            <th>Score</th>
            <th>Target</th>
          </tr>

          ${rows.map(o=>`
            <tr>
              <td>${o.date}</td>
              <td>${o.score.toFixed(1)}</td>
              <td>${o.target}</td>
            </tr>
          `).join("")}

        </table>
      </div>
    </div>

    <div class="card">
      <h3>Review</h3>
      <ol>${review}</ol>
    </div>

    <div class="card">
      <h3>Masukan / Improvement</h3>
      <ul>${suggestion}</ul>
    </div>
  `;
}

function printPage(){
 document.getElementById("screen").innerHTML=`<h1>Cetak Laporan</h1><p class="lead">Preview laporan dan pilih cetak atau share.</p><div class="card"><label>Nama Frontliner</label><select id="pname"><option value="all">Semua Nama</option>${frontliners.map(f=>`<option>${esc(f.name)}</option>`).join("")}</select><label>Periode mulai</label><input type="date" id="pstart"><label>Periode akhir</label><input type="date" id="pend"><div class="btnrow"><button class="btn primary" onclick="previewReport()">👁 Preview</button><button class="btn success" onclick="window.print()">🖨 Cetak</button><button class="btn warning" onclick="shareReport()">📤 Share / Kirim</button></div></div><div id="preview"></div>`
}
function previewReport(){let n=document.getElementById("pname").value,s=document.getElementById("pstart").value,e=document.getElementById("pend").value,rows=observations.filter(o=>(n==="all"||o.name===n)&&(!s||o.date>=s)&&(!e||o.date<=e));document.getElementById("preview").innerHTML=`<div class="card"><h2>Digital Report Frontliner</h2><p><b>Periode:</b> ${s||"-"} s/d ${e||"-"}</p><div class="tablewrap"><table class="table"><tr><th>Tanggal</th><th>Nama</th><th>Score</th></tr>${rows.map(o=>`<tr><td>${o.date}</td><td>${esc(o.name)}</td><td>${o.score.toFixed(1)}</td></tr>`).join("")||"<tr><td colspan=3>Tidak ada data.</td></tr>"}</table></div></div>`}
async function shareReport(){let txt="DIRE-F — Digital Report Frontliner\\nLaporan observasi";if(navigator.share){try{await navigator.share({title:"DIRE-F Report",text:txt})}catch(e){}}else{navigator.clipboard?.writeText(txt);toast("Ringkasan disalin")}}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
</script>
